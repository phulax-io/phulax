name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    name: install clean & smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: phulax
          POSTGRES_PASSWORD: phulax-dev-only
          POSTGRES_DB: phulax
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phulax"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://phulax:phulax-dev-only@localhost:5432/phulax
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Bootstrap (locked dependencies)
        run: uv sync --all-packages --locked

      - name: Lint
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Tests (unit + integration against service postgres)
        run: uv run pytest

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
