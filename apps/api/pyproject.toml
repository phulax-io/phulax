[project]
name = "phulax-api"
version = "0.0.1"
description = "Phulax control plane API — policy management, approvals, decision-event views"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "jsonschema>=4.23",
    "python-multipart>=0.0.18",
    "httpx>=0.27",
    "phulax-policy",
]

[tool.uv.sources]
phulax-policy = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phulax_api"]
