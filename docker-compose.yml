name: phulax

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-phulax}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phulax-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-phulax}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-phulax}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PHULAX_ENV: ${PHULAX_ENV:-dev}
      DATABASE_URL: postgresql://${POSTGRES_USER:-phulax}:${POSTGRES_PASSWORD:-phulax-dev-only}@postgres:5432/${POSTGRES_DB:-phulax}
      GATEWAY_SIGNING_KEY: ${GATEWAY_SIGNING_KEY:-fake-dev-key-change-me-not-a-secret-0001}
      POLICY_SIGNING_KEY: ${POLICY_SIGNING_KEY:?no policy signing key — run 'make bootstrap' to generate one into .env}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    environment:
      PHULAX_ENV: ${PHULAX_ENV:-dev}
      CONTROL_PLANE_URL: http://api:8000
      GATEWAY_SIGNING_KEY: ${GATEWAY_SIGNING_KEY:-fake-dev-key-change-me-not-a-secret-0001}
      POLICY_PUBLIC_KEY: ${POLICY_PUBLIC_KEY:?no policy public key — run 'make bootstrap' to generate one into .env}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
